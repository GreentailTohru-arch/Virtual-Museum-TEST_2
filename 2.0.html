<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟博物馆 - 手势控制模型交互</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        :root {
            /* 主基调：古典土黄/鎏金风格 */
            --glass-bg: rgba(220, 181, 96, 0.05);
            --glass-border: rgba(220, 181, 96, 0.3);
            --accent-color: #dcb560; 
            --text-main: #ffffff;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #020202; font-family: "SimSun", "宋体", serif; color: var(--text-main); }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

        /* --- 主界面元素的全局显隐控制 --- */
        body.app-active #welcome-screen { opacity: 0; visibility: hidden; pointer-events: none; transition: all 0.8s ease; }
        body:not(.app-active) #welcome-screen { opacity: 1; visibility: visible; pointer-events: auto; transition: all 0.8s ease; }
        
        body.app-active .main-ui { opacity: 1; visibility: visible; pointer-events: auto; transition: all 0.8s ease; }
        body:not(.app-active) .main-ui { opacity: 0; visibility: hidden; pointer-events: none; transition: all 0.8s ease; }

        /* --- 迎宾大厅 (Welcome Screen) --- */
        #welcome-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(30, 25, 15, 0.8), #000000 70%);
            z-index: 50; display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(10px); 
        }
        .welcome-box {
            text-align: center; background: var(--glass-bg); padding: 80px 100px;
            border: 1px solid var(--glass-border); border-radius: 8px;
            box-shadow: 0 0 50px rgba(220, 181, 96, 0.1); position: relative;
        }
        .welcome-box::before {
            content: ""; position: absolute; top: -1px; left: -1px; width: 30px; height: 30px;
            border-top: 3px solid var(--accent-color); border-left: 3px solid var(--accent-color);
        }
        .welcome-box::after {
            content: ""; position: absolute; bottom: -1px; right: -1px; width: 30px; height: 30px;
            border-bottom: 3px solid var(--accent-color); border-right: 3px solid var(--accent-color);
        }

        /* --- 顶置场馆 Logo --- */
        #museum-logo {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            max-height: 80px; z-index: 15; display: none; object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(220, 181, 96, 0.4));
        }

        /* --- 主界面 UI --- */
        .info-panel { 
            position: absolute; top: 40px; left: 40px; z-index: 10; 
            width: 260px; 
            height: 340px; 
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            backdrop-filter: blur(15px); padding: 25px;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
            display: flex;
            flex-direction: column;
        }
        .info-panel::before {
            content: ""; position: absolute; top: 0; left: 0; width: 15px; height: 15px;
            border-top: 3px solid var(--accent-color); border-left: 3px solid var(--accent-color);
        }
        .info-header h1 { 
            font-size: 1.8rem; margin: 0; letter-spacing: 2px; color: var(--accent-color); 
            text-shadow: 0 0 10px rgba(220, 181, 96, 0.5); 
            word-break: break-word; white-space: normal; line-height: 1.3; 
        }
        .info-header h2 { 
            font-size: 0.8rem; font-weight: 300; opacity: 0.6; margin: 8px 0 15px 0; text-transform: uppercase; 
            border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;
            word-break: break-word; white-space: normal; line-height: 1.3; 
        }
        .info-content-scroll { 
            flex-grow: 1; overflow-y: auto; margin-top: 5px; padding-right: 5px; 
        }
        .info-content-scroll p { font-size: 0.85rem; line-height: 1.7; opacity: 0.8; margin: 0; }

        #saved-list { 
            position: absolute; bottom: 110px; left: 40px; 
            display: flex; flex-direction: column; gap: 12px; z-index: 5; 
            align-items: flex-start; 
        }
        
        .history-item { 
            position: relative; padding: 12px 20px; 
            background: rgba(220, 181, 96, 0.03); border: 1px solid var(--glass-border); 
            border-left: 4px solid var(--accent-color); border-radius: 4px 12px 4px 4px; 
            font-size: 0.85rem; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            min-width: 60px; width: max-content; color: rgba(255,255,255,0.9); backdrop-filter: blur(5px);
        }
        .history-item:hover { 
            background: rgba(220, 181, 96, 0.1); border-color: var(--accent-color);
            transform: translateX(8px); box-shadow: 0 4px 15px rgba(220, 181, 96, 0.15);
        }
        .color-thumb {
            position: absolute; top: 8px; right: 8px; width: 10px; height: 10px;
            border-radius: 50%; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .vertical-title { 
            position: absolute; top: 40px; right: 50px; writing-mode: vertical-rl; 
            font-size: 3rem; font-weight: bold; opacity: 0.2; pointer-events: none; 
        }

        /* --- 优化的布展管理与分享按钮组 (占二分之一比例) --- */
        .admin-trigger { 
            position: absolute; bottom: 40px; left: 40px; z-index: 20; 
            display: flex; gap: 12px; width: 312px; 
        }
        .btn-manager { 
            flex: 1; /* 各占50% */
            box-sizing: border-box;
            background: var(--glass-bg); border: 1px solid var(--glass-border); 
            border-left: 4px solid var(--accent-color); padding: 12px 10px; 
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            font-family: "SimSun", "宋体", serif; 
            color: rgba(255,255,255,0.9); backdrop-filter: blur(10px); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            letter-spacing: 1px; border-radius: 4px; gap: 6px;
        }
        .btn-manager:hover { 
            background: rgba(220, 181, 96, 0.15); border-color: var(--accent-color);
            box-shadow: 0 4px 15px rgba(220, 181, 96, 0.2); transform: translateX(8px);
        }
        .btn-manager-sub {
            color: var(--accent-color); font-size: 0.75rem; font-weight: bold; opacity: 0.9;
        }

        .btn-main { background: transparent; color: white; border: 1px solid var(--glass-border); padding: 10px 20px; cursor: pointer; transition: 0.3s; font-size: 0.8rem; }
        .btn-main:hover { background: var(--accent-color); color: black; }

        .status-btn {
            background: transparent; font-size: 0.7rem; padding: 4px 10px; cursor: pointer; 
            border-radius: 3px; transition: all 0.3s; font-family: "SimSun", "宋体", serif;
        }
        .status-btn.active { border: 1px solid var(--accent-color); color: var(--accent-color); }
        .status-btn.inactive { border: 1px solid #666; color: #666; }
        .status-btn:hover { background: rgba(255,255,255,0.1); }

        /* --- 底部手势 HUD UI --- */
        #gesture-hints {
            position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 40px; z-index: 20; pointer-events: none;
            background: transparent; 
        }
        .hint-item {
            font-family: 'Arial', sans-serif; font-size: 0.85rem; font-weight: 500;
            color: rgba(255, 255, 255, 0.3); letter-spacing: 2px;
            transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;
            text-transform: uppercase;
        }
        .hint-item span.icon { font-size: 1.2rem; filter: grayscale(100%); opacity: 0.5; transition: 0.3s; }
        
        .hint-item.active {
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 5px rgba(255, 255, 255, 0.5);
            transform: scale(1.05) translateY(-5px);
        }
        .hint-item.active span.icon { filter: grayscale(0%); opacity: 1; text-shadow: 0 0 15px rgba(255,255,255,0.8); }

        /* --- 右下角摄像头模块 --- */
        .gesture-module-wrapper {
            position: absolute; bottom: 40px; right: 40px;
            display: flex; flex-direction: column; align-items: center; z-index: 20;
        }
        .gesture-row {
            display: flex; align-items: flex-end; justify-content: flex-end; gap: 15px;
        }
        
        .skeleton-module {
            width: 130px; height: 80px; border-radius: 40px; border: 2px solid var(--glass-border);
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); overflow: hidden; position: relative;
            box-shadow: 0 0 15px rgba(220, 181, 96, 0.05); transition: all 0.3s ease;
        }
        .skeleton-module.active { border-color: #ffffff; box-shadow: 0 0 20px rgba(255, 255, 255, 0.4); }
        .skeleton-canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .gesture-module {
            width: 130px; height: 130px; border-radius: 50%; border: 2px solid var(--glass-border);
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); overflow: hidden; position: relative;
            box-shadow: 0 0 20px rgba(220, 181, 96, 0.1); transition: all 0.3s ease;
        }
        .gesture-module.active { border-color: var(--accent-color); box-shadow: 0 0 30px rgba(220, 181, 96, 0.4); }
        .gesture-video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0.6; }
        
        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--accent-color); box-shadow: 0 0 10px var(--accent-color);
            animation: scan 2.5s linear infinite; opacity: 0.5; display: none;
        }
        .gesture-module.active .scan-line { display: block; }
        @keyframes scan { 0% { top: -10%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 110%; opacity: 0; } }
        
        .gesture-status-tech { 
            position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
            font-size: 0.75rem; color: var(--text-main); opacity: 0.6; letter-spacing: 2px; 
            font-family: 'Arial', sans-serif; white-space: nowrap; transition: 0.3s;
        }

        /* --- 管理界面 (带过渡动画) --- */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 100; backdrop-filter: blur(10px); 
            opacity: 0; visibility: hidden; pointer-events: none; transition: all 0.4s ease;
        }
        .modal-overlay.show { opacity: 1; visibility: visible; pointer-events: auto; }
        
        .modal-content { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -45%); 
            width: 900px; max-height: 85vh; background: #0a0a0a; border: 1px solid var(--glass-border); padding: 40px; display: flex; flex-direction: column; 
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); opacity: 0;
        }
        .modal-overlay.show .modal-content { transform: translate(-50%, -50%); opacity: 1; }
        
        .archive-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; overflow-y: auto; margin-bottom: 30px; flex-grow: 1; padding-right: 10px; }
        .archive-card { background: #111; border: 1px solid #222; padding: 20px; transition: 0.3s; }
        .archive-card:hover { border-color: var(--accent-color); }

        .sub-modal { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a; z-index: 110; padding: 40px; box-sizing: border-box; overflow-y: auto; 
            opacity: 0; visibility: hidden; pointer-events: none; transform: translateX(30px); transition: all 0.4s ease;
        }
        .sub-modal.show { opacity: 1; visibility: visible; pointer-events: auto; transform: translateX(0); }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group label { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--accent-color); margin-bottom: 8px; }
        input[type="text"], textarea { width: 100%; background: #111; border: 1px solid #333; color: white; padding: 12px; box-sizing: border-box; }
        
        .control-panel { background: rgba(255,255,255,0.03); padding: 20px; border: 1px solid #222; margin-top: 10px; }
        .control-panel h4 { margin: 0 0 15px 0; font-size: 0.8rem; color: #888; text-transform: uppercase; }
        input[type="range"] { width: 100%; accent-color: var(--accent-color); cursor: pointer; }

        .color-mode-switch { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-btn { flex: 1; background: #111; border: 1px solid #333; color: #666; padding: 8px; cursor: pointer; font-size: 0.75rem; }
        .mode-btn.active { border-color: var(--accent-color); color: var(--accent-color); background: var(--glass-bg); }
        
        .preset-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .preset-color { width: 30px; height: 30px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .preset-color:hover { transform: scale(1.1); }
        .preset-color.selected { border-color: white; box-shadow: 0 0 8px white; }

        .custom-gradient-box { display: flex; align-items: center; gap: 15px; background: rgba(220, 181, 96, 0.05); padding: 10px; border-radius: 4px; border: 1px dashed #444; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="welcome-screen">
        <div class="welcome-box">
            <div style="font-size: 4rem; color: var(--accent-color); margin-bottom: 20px; font-weight:bold; letter-spacing: 5px; text-shadow: 0 0 20px rgba(220,181,96,0.6);">虚拟博物馆</div>
            <div style="font-size: 1.2rem; color: rgba(255,255,255,0.8); margin-bottom: 50px; letter-spacing: 6px;">手势控制模型交互2.0</div>
            <button class="btn-manager" style="width: auto; padding: 15px 40px; margin: 0 auto; flex: none; flex-direction: row; justify-content: center; font-size: 1.1rem; border-left: 1px solid var(--glass-border); border-bottom: 4px solid var(--accent-color);" onclick="openManager()">开始布展</button>
        </div>
    </div>
    
    <img id="museum-logo" class="main-ui" src="" alt="Museum Logo">

    <div id="gesture-hints" class="main-ui">
        <div id="hint-pos" class="hint-item"><span class="icon">🖐️</span> POSITION</div>
        <div id="hint-scale" class="hint-item"><span class="icon">✊</span> SCALE</div>
        <div id="hint-switch" class="hint-item"><span class="icon">🤏</span> SWITCH</div>
    </div>

    <div class="info-panel main-ui">
        <div class="info-header">
            <h1 id="curr-title">数字遗珍</h1>
            <h2 id="curr-subtitle">Digital Heritage System</h2>
        </div>
        <div class="info-content-scroll">
            <p id="curr-desc">系统待机。请进入布局管理配置文物点云档案。</p>
        </div>
    </div>

    <div id="saved-list" class="main-ui"></div>
    <div class="vertical-title main-ui" id="vertical-text">NEBULA</div>

    <div class="admin-trigger main-ui">
        <button class="btn-manager" onclick="openManager()">
            <span style="font-size: 0.95rem;">⚙ 布展管理</span>
            <span id="archive-count" class="btn-manager-sub">（0件）</span>
        </button>
        <button id="btn-share" class="btn-manager" onclick="takeScreenshot()">
            <span style="font-size: 0.95rem;">📸 即刻分享</span>
            <span class="btn-manager-sub">保存为纪念卡</span>
        </button>
    </div>

    <div class="gesture-module-wrapper main-ui">
        <div class="gesture-row">
            <div class="skeleton-module" id="skeleton-ui">
                <canvas id="skeleton-canvas" class="skeleton-canvas"></canvas>
            </div>
            
            <div style="position: relative;">
                <div id="gesture-status" class="gesture-status-tech">INITIALIZING...</div>
                
                <div class="gesture-module" id="gesture-ui">
                    <video id="gesture-video" class="gesture-video" autoplay playsinline></video>
                    <div class="scan-line"></div>
                </div>
                
                <svg width="140" height="140" style="position: absolute; top: -5px; left: -5px; pointer-events: none;">
                    <circle id="switch-progress" stroke="#ffffff" stroke-width="4" fill="transparent" r="65" cx="70" cy="70" style="transition: stroke-dashoffset 0.1s linear; transform: rotate(-90deg); transform-origin: 50% 50%;" />
                </svg>
            </div>
        </div>
    </div>

    <div id="manager-overlay" class="modal-overlay">
        <div class="modal-content">
            <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h3 style="margin:0; color: var(--accent-color);">档案库管理</h3>
                
                <div style="display: flex; gap: 15px;">
                    <input type="file" id="logo-upload" accept="image/*" style="display: none;" onchange="handleLogoUpload(event)">
                    <button class="btn-main" onclick="document.getElementById('logo-upload').click()">场馆命名</button>
                    <button class="btn-main" onclick="closeManager()">返回展示</button>
                </div>
            </div>
            <div id="archive-grid" class="archive-grid"></div>
            <button class="btn-main" style="width: 100%; padding: 15px; border-style: dashed;" onclick="openSubModal()">+ 新建档案词条</button>
        </div>

        <div id="sub-modal" class="sub-modal">
            <h3 id="sub-title-text" style="color: var(--accent-color); margin-top:0;">精细化参数调节</h3>
            <input type="hidden" id="edit-id">
            
            <div class="form-row">
                <div class="form-group"><label>标题</label><input type="text" id="in-title"></div>
                <div class="form-group"><label>副标题 (English)</label><input type="text" id="in-subtitle"></div>
            </div>

            <div class="form-group" style="margin-bottom:20px;">
                <label>描述内容</label><textarea id="in-desc" rows="3"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>模型上传 (.obj) <span id="file-status"></span></label>
                    <input type="file" id="in-file" accept=".obj">
                </div>
            </div>

            <div class="control-panel">
                <h4>渲染参数 (Physical Controls)</h4>
                <div class="form-row">
                    <div class="form-group">
                        <label>采样密度 <span id="val-density">5</span></label>
                        <input type="range" id="ctrl-density" min="1" max="30" value="5" oninput="document.getElementById('val-density').innerText=this.value">
                    </div>
                    <div class="form-group">
                        <label>粒子大小 <span id="val-size">0.03</span></label>
                        <input type="range" id="ctrl-size" min="0.005" max="0.15" step="0.005" value="0.03" oninput="document.getElementById('val-size').innerText=this.value">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>透明度 <span id="val-opacity">0.8</span></label>
                        <input type="range" id="ctrl-opacity" min="0.1" max="1.0" step="0.1" value="0.8" oninput="document.getElementById('val-opacity').innerText=this.value">
                    </div>
                </div>
            </div>

            <div class="control-panel">
                <h4>粒子色彩方案 (Color Palette)</h4>
                <div class="color-mode-switch">
                    <button class="mode-btn active" id="btn-mode-single" onclick="switchColorMode('single')">单色方案</button>
                    <button class="mode-btn" id="btn-mode-gradient" onclick="switchColorMode('gradient')">渐变方案</button>
                </div>

                <div id="panel-single-color">
                    <label style="font-size:0.75rem; color:#888;">预设单色：</label>
                    <div class="preset-group" id="single-presets">
                        <div class="preset-color" style="background:#dcb560" onclick="selectSingle('#dcb560')" title="岁月金"></div>
                        <div class="preset-color" style="background:#8b4513" onclick="selectSingle('#8b4513')" title="青铜褐"></div>
                        <div class="preset-color" style="background:#e8e6d9" onclick="selectSingle('#e8e6d9')" title="宣纸白"></div>
                        <div class="preset-color" style="background:#5c7a72" onclick="selectSingle('#5c7a72')" title="汝窑青"></div>
                        <div class="preset-color" style="background:#8a3324" onclick="selectSingle('#8a3324')" title="朱砂红"></div>
                    </div>
                    <div class="form-group" style="margin-top:15px;">
                        <label>自定义单色选择器</label>
                        <input type="color" id="ctrl-color-single" value="#dcb560" style="width:100%; height:40px; background:none; border:1px solid #333; cursor:pointer;">
                    </div>
                </div>

                <div id="panel-gradient-color" style="display:none;">
                    <label style="font-size:0.75rem; color:#888;">预设渐变：</label>
                    <div class="preset-group" id="grad-presets">
                        <div class="preset-color" style="background:linear-gradient(#dcb560, #8b4513)" onclick="selectGradient('#dcb560', '#8b4513')" title="敦煌壁画"></div>
                        <div class="preset-color" style="background:linear-gradient(#e8e6d9, #5c7a72)" onclick="selectGradient('#e8e6d9', '#5c7a72')" title="水墨水乡"></div>
                        <div class="preset-color" style="background:linear-gradient(#8a3324, #dcb560)" onclick="selectGradient('#8a3324', '#dcb560')" title="宫墙夕照"></div>
                        <div class="preset-color" style="background:linear-gradient(#4a4a4a, #8b4513)" onclick="selectGradient('#4a4a4a', '#8b4513')" title="千年古木"></div>
                        <div class="preset-color" style="background:linear-gradient(#c9a25b, #506e48)" onclick="selectGradient('#c9a25b', '#506e48')" title="绿锈古金"></div>
                        <div class="preset-color" style="background:linear-gradient(#6e8c81, #233a31)" onclick="selectGradient('#6e8c81', '#233a31')" title="商周青铜"></div>
                        <div class="preset-color" style="background:linear-gradient(#89cff0, #ffb6c1)" onclick="selectGradient('#89cff0', '#ffb6c1')" title="霓霞琉璃"></div>
                        <div class="preset-color" style="background:linear-gradient(#f3f9f1, #0f4c81)" onclick="selectGradient('#f3f9f1', '#0f4c81')" title="传世青花"></div>
                    </div>
                    <div style="margin-top:15px;">
                        <label style="font-size:0.75rem; color:#888; display:block; margin-bottom:8px;">自定义渐变调色：</label>
                        <div class="custom-gradient-box">
                            <div style="flex:1">
                                <span style="font-size:0.65rem; color:var(--accent-color)">顶部颜色</span>
                                <input type="color" id="ctrl-grad-top" value="#dcb560" style="width:100%; height:30px; border:none; background:none; cursor:pointer;">
                            </div>
                            <div style="color:#444">➔</div>
                            <div style="flex:1">
                                <span style="font-size:0.65rem; color:var(--accent-color)">底部颜色</span>
                                <input type="color" id="ctrl-grad-bottom" value="#8b4513" style="width:100%; height:30px; border:none; background:none; cursor:pointer;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div style="margin-top: 30px; display:flex; gap: 20px;">
                <button class="btn-main" onclick="handleSave()" style="flex:2; background: var(--accent-color); color:black; font-weight:bold;">保存配置</button>
                <button class="btn-main" onclick="closeSubModal()" style="flex:1;">放弃修改</button>
            </div>
        </div>
    </div>

    <script>
        // 渲染开启保留绘图缓冲区，以支持无损截图保存
        let scene, camera, renderer, currentPoints, starfield;
        let archives = [];
        let currentColorMode = 'single';

        // --- 手势控制参数 ---
        let isHandDetected = false;
        let targetRotationY = 0;
        let targetRotationX = 0; 
        let targetPositionX = 0; 
        let targetScaleMult = 1.0;
        
        let lastSwitchTime = 0; 
        let pinchStartTime = 0;
        let hasSwitched = false; 

        // --- 过渡动画引擎核心参数 ---
        let isTransitioning = false;
        let transitionPhase = 'idle'; 
        let transitionProgress = 0;
        let scatterDirs = [];
        let originalScatterColors = null; 
        let nextModelData = null;
        let gatherStartPositions = [];
        let gatherTargetPositions = [];
        let targetOpacity = 0.8;
        let originalOpacity = 0.8;
        let currentDisplayId = null; 

        function initScene() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 8);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            const starGeo = new THREE.BufferGeometry();
            const starCount = 4000;
            const starPos = new Float32Array(starCount * 3);
            for(let i=0; i<starCount*3; i++) {
                starPos[i] = (Math.random() - 0.5) * 80; 
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({
                color: 0xdcb560,
                size: 0.06,
                transparent: true,
                opacity: 0, 
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            starfield = new THREE.Points(starGeo, starMat);
            scene.add(starfield);

            checkAppState(); 
            animate();
        }

        function typeWriter(elementId, text, speed) {
            const el = document.getElementById(elementId);
            if(!el) return;
            if(el.typewriterTimer) clearInterval(el.typewriterTimer);
            el.innerText = '';
            if(!text) return;
            let i = 0;
            el.typewriterTimer = setInterval(() => {
                if(i < text.length) {
                    el.innerText += text.charAt(i);
                    i++;
                } else {
                    clearInterval(el.typewriterTimer);
                }
            }, speed);
        }

        function checkAppState() {
            const activeArchives = archives.filter(a => a.enabled !== false);
            if (activeArchives.length === 0) {
                document.body.classList.remove('app-active');
                if (currentPoints) {
                    scene.remove(currentPoints);
                    currentPoints = null;
                    currentDisplayId = null;
                }
            } else {
                document.body.classList.add('app-active');
                if (!currentDisplayId || !activeArchives.find(a => a.id === currentDisplayId)) {
                    processModel(activeArchives[0]);
                }
            }
            updateSideList();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (starfield) {
                starfield.rotation.y += 0.0005;
                starfield.rotation.x += 0.0002;
                if (isTransitioning) {
                    starfield.material.opacity += (0.9 - starfield.material.opacity) * 0.05;
                    starfield.material.size = 0.06 + Math.sin(Date.now() * 0.02) * 0.03; 
                } else {
                    starfield.material.opacity += (0 - starfield.material.opacity) * 0.05;
                    starfield.material.size = 0.06; 
                }
            }

            if (isTransitioning && currentPoints) {
                const posAttr = currentPoints.geometry.attributes.position;
                const colorAttr = currentPoints.geometry.attributes.color;

                if (transitionPhase === 'scatter') {
                    transitionProgress += 0.01; 
                    if (transitionProgress > 1) transitionProgress = 1;
                    
                    for(let i=0; i<posAttr.count; i++) {
                        posAttr.setXYZ( i, posAttr.getX(i) + scatterDirs[i*3], posAttr.getY(i) + scatterDirs[i*3+1], posAttr.getZ(i) + scatterDirs[i*3+2] );
                        
                        if (Math.random() < 0.05) { 
                            colorAttr.setXYZ(i, 1.0, 1.0, 1.0);
                        } else {
                            colorAttr.setXYZ(i, originalScatterColors[i*3], originalScatterColors[i*3+1], originalScatterColors[i*3+2]);
                        }
                    }
                    posAttr.needsUpdate = true;
                    colorAttr.needsUpdate = true;
                    currentPoints.material.opacity = originalOpacity * (1 - transitionProgress);
                    currentPoints.rotation.y += 0.01; 

                    if (transitionProgress === 1) startGather();
                } 
                else if (transitionPhase === 'gather') {
                    transitionProgress += 0.006; 
                    if (transitionProgress > 1) transitionProgress = 1;
                    let ease = 1 - Math.pow(1 - transitionProgress, 3);
                    for(let i=0; i<posAttr.count; i++) {
                        posAttr.setXYZ( i,
                            gatherStartPositions[i*3] + (gatherTargetPositions[i*3] - gatherStartPositions[i*3]) * ease,
                            gatherStartPositions[i*3+1] + (gatherTargetPositions[i*3+1] - gatherStartPositions[i*3+1]) * ease,
                            gatherStartPositions[i*3+2] + (gatherTargetPositions[i*3+2] - gatherStartPositions[i*3+2]) * ease
                        );
                    }
                    posAttr.needsUpdate = true;
                    currentPoints.material.opacity = targetOpacity * ease;
                    currentPoints.rotation.y += 0.015 * (1 - ease) + 0.002 * ease;
                    
                    if (transitionProgress === 1) {
                        for(let i=0; i<posAttr.count; i++) posAttr.setXYZ(i, gatherTargetPositions[i*3], gatherTargetPositions[i*3+1], gatherTargetPositions[i*3+2]);
                        posAttr.needsUpdate = true;
                        isTransitioning = false;
                        transitionPhase = 'idle';
                    }
                }
            } 
            else if (currentPoints) {
                if (isHandDetected) {
                    currentPoints.rotation.y += (targetRotationY - currentPoints.rotation.y) * 0.1;
                    currentPoints.rotation.x += (targetRotationX - currentPoints.rotation.x) * 0.1; 
                    currentPoints.position.x += (targetPositionX - currentPoints.position.x) * 0.1; 
                    if(currentPoints.userData && currentPoints.userData.baseScale) {
                        const targetS = currentPoints.userData.baseScale * targetScaleMult;
                        currentPoints.scale.lerp(new THREE.Vector3(targetS, targetS, targetS), 0.15);
                    }
                } else {
                    currentPoints.rotation.y += 0.002;
                    currentPoints.rotation.x += (0 - currentPoints.rotation.x) * 0.05; 
                    currentPoints.position.x += (0 - currentPoints.position.x) * 0.05; 
                    if(currentPoints.userData && currentPoints.userData.baseScale) {
                        const baseS = currentPoints.userData.baseScale;
                        currentPoints.scale.lerp(new THREE.Vector3(baseS, baseS, baseS), 0.05);
                    }
                }
            }
            renderer.render(scene, camera);
        }

        function processModel(data) {
            if(!data.objData) return;
            if (currentPoints && currentDisplayId !== data.id && currentDisplayId !== null) {
                nextModelData = data;
                startScatter();
            } else {
                loadModelImmediately(data, false);
            }
            currentDisplayId = data.id;
        }

        function startScatter() {
            isTransitioning = true;
            transitionPhase = 'scatter';
            transitionProgress = 0;
            originalOpacity = currentPoints.material.opacity;
            
            const posAttr = currentPoints.geometry.attributes.position;
            const colorAttr = currentPoints.geometry.attributes.color;
            const positions = posAttr.array;
            
            originalScatterColors = new Float32Array(colorAttr.array);
            scatterDirs = new Float32Array(positions.length);
            
            const scale = currentPoints.scale.x || 1;
            const speedBase = 2.0 / scale; 
            for(let i=0; i<positions.length; i+=3) {
                let vx = positions[i]; let vy = positions[i+1]; let vz = positions[i+2];
                let len = Math.sqrt(vx*vx + vy*vy + vz*vz) || 1;
                let speed = speedBase * (0.5 + Math.random());
                scatterDirs[i] = (vx/len) * speed + (Math.random()-0.5) * speedBase * 0.2;
                scatterDirs[i+1] = (vy/len) * speed + (Math.random()-0.5) * speedBase * 0.2;
                scatterDirs[i+2] = (vz/len) * speed + (Math.random()-0.5) * speedBase * 0.2;
            }
        }

        function startGather() {
            if(currentPoints) scene.remove(currentPoints);
            loadModelImmediately(nextModelData, true);
            transitionPhase = 'gather';
            transitionProgress = 0;
        }

        function loadModelImmediately(data, startScattered = false) {
            if(currentPoints && !startScattered) scene.remove(currentPoints);
            const object = new THREE.OBJLoader().parse(data.objData);
            let vertices = [], colors = [];
            const colorTop = new THREE.Color(data.gradTop);
            const colorBottom = new THREE.Color(data.gradBottom);
            const singleColor = new THREE.Color(data.singleColor);

            object.traverse(c => {
                if(c.isMesh) {
                    const attr = c.geometry.attributes.position;
                    let minY = Infinity, maxY = -Infinity;
                    for(let i=0; i<attr.count; i+=data.density) {
                        const y = attr.getY(i);
                        if(y < minY) minY = y; if(y > maxY) maxY = y;
                    }
                    for(let i=0; i<attr.count; i += data.density) {
                        const vx = attr.getX(i), vy = attr.getY(i), vz = attr.getZ(i);
                        vertices.push(vx, vy, vz);
                        if(data.colorMode === 'gradient') {
                            const ratio = (vy - minY) / (maxY - minY || 1);
                            const cMixed = new THREE.Color().copy(colorBottom).lerp(colorTop, ratio);
                            colors.push(cMixed.r, cMixed.g, cMixed.b);
                        } else {
                            colors.push(singleColor.r, singleColor.g, singleColor.b);
                        }
                    }
                }
            });

            const tempGeo = new THREE.BufferGeometry();
            tempGeo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            tempGeo.computeBoundingBox();
            const center = new THREE.Vector3(); 
            tempGeo.boundingBox.getCenter(center);
            const maxDim = Math.max(tempGeo.boundingBox.max.x - tempGeo.boundingBox.min.x, tempGeo.boundingBox.max.y - tempGeo.boundingBox.min.y, tempGeo.boundingBox.max.z - tempGeo.boundingBox.min.z) || 1;
            const scale = 5 / maxDim;

            for(let i=0; i<vertices.length; i+=3) {
                vertices[i] -= center.x; vertices[i+1] -= center.y; vertices[i+2] -= center.z;
            }

            const geo = new THREE.BufferGeometry();
            
            if (startScattered) {
                gatherTargetPositions = new Float32Array(vertices);
                gatherStartPositions = new Float32Array(vertices.length);
                let scatteredVerts = [];
                const scatterRadiusBase = 15 / scale; 
                for(let i=0; i<vertices.length; i+=3) {
                    let theta = Math.random() * Math.PI * 2;
                    let phi = Math.acos((Math.random() * 2) - 1);
                    let r = scatterRadiusBase + Math.random() * scatterRadiusBase;
                    gatherStartPositions[i] = vertices[i] + r * Math.sin(phi) * Math.cos(theta);
                    gatherStartPositions[i+1] = vertices[i+1] + r * Math.sin(phi) * Math.sin(theta);
                    gatherStartPositions[i+2] = vertices[i+2] + r * Math.cos(phi);
                    scatteredVerts.push(gatherStartPositions[i], gatherStartPositions[i+1], gatherStartPositions[i+2]);
                }
                geo.setAttribute('position', new THREE.Float32BufferAttribute(scatteredVerts, 3));
            } else {
                geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            }
            
            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            
            const mat = new THREE.PointsMaterial({ 
                size: data.size, transparent: true, opacity: startScattered ? 0 : data.opacity, 
                vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false
            });

            currentPoints = new THREE.Points(geo, mat);
            currentPoints.scale.set(scale, scale, scale);
            currentPoints.userData = { baseScale: scale }; 

            scene.add(currentPoints);
            targetOpacity = data.opacity || 0.8;

            document.getElementById('curr-title').innerText = data.title;
            document.getElementById('curr-subtitle').innerText = data.subtitle || "ARTIFACT";
            typeWriter('curr-desc', data.desc || "暂无文字描述。", 30);
            typeWriter('vertical-text', data.title || "NEBULA", 150);
        }

        function switchToNextModel() {
            const activeArchives = archives.filter(a => a.enabled !== false);
            if (activeArchives.length <= 1) return;
            let currentIndex = activeArchives.findIndex(a => a.id === currentDisplayId);
            if (currentIndex === -1) currentIndex = 0;
            let nextIndex = (currentIndex + 1) % activeArchives.length;
            processModel(activeArchives[nextIndex]);
        }

        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const logo = document.getElementById('museum-logo');
                    logo.src = e.target.result;
                    logo.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        // --- 竖版黄金比例卡片截图分享功能 ---
        function takeScreenshot() {
            const btn = document.getElementById('btn-share');
            if (!btn) return;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<span style="font-size: 0.95rem;">📸 生成中...</span><span class="btn-manager-sub">请稍候</span>`;

            // 强制渲染以捕获当下画面
            renderer.render(scene, camera);
            const canvas = renderer.domElement;
            
            const w = canvas.width;
            const h = canvas.height;
            let targetW = h * (9/16);
            let targetH = h;
            
            if(targetW > w) {
                targetW = w;
                targetH = w * (16/9);
            }
            
            const sx = (w - targetW) / 2;
            const sy = (h - targetH) / 2;
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = targetW;
            tempCanvas.height = targetH;
            const ctx = tempCanvas.getContext('2d');
            
            // 裁切并绘制中心大图
            ctx.drawImage(canvas, sx, sy, targetW, targetH, 0, 0, targetW, targetH);
            
            // 绘制底部融合黑影，供文字浮现
            const grad = ctx.createLinearGradient(0, targetH - 350, 0, targetH);
            grad.addColorStop(0, 'transparent');
            grad.addColorStop(1, 'rgba(0,0,0,0.95)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, targetH - 350, targetW, 350);
            
            // 提取当前文案并合成
            const title = document.getElementById('curr-title').innerText || '数字遗珍';
            const subtitle = document.getElementById('curr-subtitle').innerText || 'Digital Heritage';
            
            ctx.fillStyle = '#dcb560';
            ctx.font = 'bold 50px "SimSun", "宋体", serif';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(220, 181, 96, 0.5)';
            ctx.shadowBlur = 15;
            ctx.fillText(title, targetW / 2, targetH - 120);
            
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.font = '24px "Arial", sans-serif';
            ctx.shadowBlur = 0;
            ctx.fillText(subtitle, targetW / 2, targetH - 70);
            
            const filename = `数字遗珍_卡片截图_${Date.now()}.png`;

            const logoEl = document.getElementById('museum-logo');
            if(logoEl && logoEl.getAttribute('src') && logoEl.style.display !== 'none') {
                const logoImg = new Image();
                logoImg.onload = () => {
                    const logoHeight = 100;
                    const logoWidth = logoImg.width * (logoHeight / logoImg.height);
                    ctx.shadowColor = 'rgba(220, 181, 96, 0.4)';
                    ctx.shadowBlur = 15;
                    ctx.drawImage(logoImg, (targetW - logoWidth) / 2, 80, logoWidth, logoHeight);
                    downloadCanvas(tempCanvas, filename);
                    btn.innerHTML = originalHTML;
                };
                logoImg.onerror = () => {
                    downloadCanvas(tempCanvas, filename);
                    btn.innerHTML = originalHTML;
                };
                logoImg.src = logoEl.src;
            } else {
                downloadCanvas(tempCanvas, filename);
                btn.innerHTML = originalHTML;
            }
        }

        // --- 直接下载 Canvas 图片函数 ---
        function downloadCanvas(canvas, filename) {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = filename;
            link.click();
        }

        // --- UI 管理逻辑 ---
        function openManager() { document.getElementById('manager-overlay').classList.add('show'); renderGrid(); }
        function closeManager() { 
            document.getElementById('manager-overlay').classList.remove('show'); 
            checkAppState(); 
        }
        
        function switchColorMode(mode) {
            currentColorMode = mode;
            document.getElementById('btn-mode-single').classList.toggle('active', mode==='single');
            document.getElementById('btn-mode-gradient').classList.toggle('active', mode==='gradient');
            document.getElementById('panel-single-color').style.display = (mode==='single') ? 'block' : 'none';
            document.getElementById('panel-gradient-color').style.display = (mode==='gradient') ? 'block' : 'none';
        }

        function selectSingle(color) { document.getElementById('ctrl-color-single').value = color; highlightPreset('single-presets', event.target); }
        function selectGradient(top, bottom) { document.getElementById('ctrl-grad-top').value = top; document.getElementById('ctrl-grad-bottom').value = bottom; highlightPreset('grad-presets', event.target); }
        function highlightPreset(parentId, target) { document.querySelectorAll(`#${parentId} .preset-color`).forEach(p => p.classList.remove('selected')); if(target) target.classList.add('selected'); }

        function openSubModal(id = null) {
            document.getElementById('sub-modal').classList.add('show');
            if(id) {
                const data = archives.find(a => a.id == id);
                document.getElementById('edit-id').value = data.id;
                document.getElementById('in-title').value = data.title;
                document.getElementById('in-subtitle').value = data.subtitle;
                document.getElementById('in-desc').value = data.desc;
                document.getElementById('ctrl-density').value = data.density;
                document.getElementById('ctrl-size').value = data.size;
                document.getElementById('ctrl-opacity').value = data.opacity || 0.8;
                switchColorMode(data.colorMode || 'single');
                document.getElementById('ctrl-color-single').value = data.singleColor || '#dcb560';
                document.getElementById('ctrl-grad-top').value = data.gradTop || '#dcb560';
                document.getElementById('ctrl-grad-bottom').value = data.gradBottom || '#8b4513';
                updateLabels(data);
            } else { resetForm(); }
        }

        function updateLabels(data) {
            document.getElementById('val-density').innerText = data.density;
            document.getElementById('val-size').innerText = data.size;
            document.getElementById('val-opacity').innerText = data.opacity || 0.8;
        }

        function closeSubModal() { document.getElementById('sub-modal').classList.remove('show'); }

        function handleSave() {
            const id = document.getElementById('edit-id').value;
            const fileInput = document.getElementById('in-file');
            const config = {
                title: document.getElementById('in-title').value, subtitle: document.getElementById('in-subtitle').value, desc: document.getElementById('in-desc').value,
                density: parseInt(document.getElementById('ctrl-density').value), size: parseFloat(document.getElementById('ctrl-size').value), opacity: parseFloat(document.getElementById('ctrl-opacity').value),
                colorMode: currentColorMode, singleColor: document.getElementById('ctrl-color-single').value, gradTop: document.getElementById('ctrl-grad-top').value, gradBottom: document.getElementById('ctrl-grad-bottom').value
            };

            const saveAction = (modelData) => {
                if(id) {
                    const idx = archives.findIndex(a => a.id == id);
                    archives[idx] = { ...archives[idx], ...config };
                    if(modelData) archives[idx].objData = modelData;
                } else {
                    if(!modelData) return alert("请上传模型");
                    archives.push({ id: Date.now(), enabled: true, ...config, objData: modelData });
                }
                checkAppState();
                renderGrid(); 
                closeSubModal();
            };

            if(fileInput.files[0]) {
                const reader = new FileReader(); reader.onload = (e) => saveAction(e.target.result); reader.readAsText(fileInput.files[0]);
            } else { saveAction(); }
        }

        function toggleArchiveStatus(id) {
            const idx = archives.findIndex(a => a.id === id);
            if(idx > -1) {
                archives[idx].enabled = archives[idx].enabled === false ? true : false;
                checkAppState();
                renderGrid();
            }
        }

        function renderGrid() {
            const grid = document.getElementById('archive-grid'); grid.innerHTML = '';
            archives.forEach(item => {
                const card = document.createElement('div'); card.className = 'archive-card';
                const isEnabled = item.enabled !== false;
                const statusText = isEnabled ? '珍藏展出中' : '保养修复中';
                const statusClass = isEnabled ? 'active' : 'inactive';
                
                card.innerHTML = `
                    <div style="display:flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <h4 class="card-title" style="margin:0; color: ${isEnabled ? 'var(--text-main)' : '#888'}">${item.title}</h4>
                            <div style="font-size:0.7rem; color:#555; margin-top:5px;">${item.subtitle || 'Nebula'}</div>
                        </div>
                        <button class="status-btn ${statusClass}" onclick="toggleArchiveStatus(${item.id})">${statusText}</button>
                    </div>
                    <div style="margin-top:15px; opacity: ${isEnabled ? '1' : '0.5'}; transition: 0.3s;">
                        <button class="btn-main" style="padding:6px 12px;" onclick="openSubModal(${item.id})">编辑参数</button>
                        <button class="btn-main" style="padding:6px 12px; border-color:#833; color:#833;" onclick="deleteArchive(${item.id})">移除</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateSideList() {
            const list = document.getElementById('saved-list'); list.innerHTML = '';
            const activeArchives = archives.filter(a => a.enabled !== false);
            activeArchives.forEach(item => {
                const div = document.createElement('div'); div.className = 'history-item';
                const textSpan = document.createElement('span');
                textSpan.style.display = 'block'; textSpan.style.paddingRight = '15px'; textSpan.style.whiteSpace = 'nowrap'; textSpan.innerText = item.title;
                div.appendChild(textSpan);

                const colorCircle = document.createElement('div'); colorCircle.className = 'color-thumb';
                if (item.colorMode === 'gradient') colorCircle.style.background = `linear-gradient(135deg, ${item.gradTop}, ${item.gradBottom})`;
                else colorCircle.style.background = item.singleColor || '#dcb560';
                div.appendChild(colorCircle);

                div.onclick = () => processModel(item);
                list.appendChild(div);
            });
            const countEl = document.getElementById('archive-count');
            if(countEl) countEl.innerText = `（${activeArchives.length}件）`;
        }

        function deleteArchive(id) {
            archives = archives.filter(a => a.id !== id);
            checkAppState();
            renderGrid(); 
        }

        function resetForm() {
            document.getElementById('edit-id').value = ''; document.getElementById('in-title').value = '';
            document.getElementById('in-subtitle').value = ''; document.getElementById('in-desc').value = ''; document.getElementById('in-file').value = '';
            switchColorMode('single'); highlightPreset('single-presets', null); highlightPreset('grad-presets', null);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // MediaPipe 手势识别逻辑
        // ==========================================
        const videoElement = document.getElementById('gesture-video');
        const gestureStatus = document.getElementById('gesture-status');
        const gestureUI = document.getElementById('gesture-ui');
        
        const skeletonUI = document.getElementById('skeleton-ui');
        const skeletonCanvas = document.getElementById('skeleton-canvas');
        const canvasCtx = skeletonCanvas.getContext('2d');
        skeletonCanvas.width = 320;
        skeletonCanvas.height = 240;

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1, 
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults((results) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, skeletonCanvas.width, skeletonCanvas.height);
            canvasCtx.filter = 'grayscale(100%) brightness(0.8)';
            canvasCtx.drawImage(results.image, 0, 0, skeletonCanvas.width, skeletonCanvas.height);
            canvasCtx.filter = 'none'; 

            const progressCircle = document.getElementById('switch-progress');
            const circumference = 65 * 2 * Math.PI; 
            if (!progressCircle.style.strokeDasharray) {
                progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
                progressCircle.style.strokeDashoffset = circumference;
            }

            const now = Date.now();
            const hintPos = document.getElementById('hint-pos');
            const hintScale = document.getElementById('hint-scale');
            const hintSwitch = document.getElementById('hint-switch');

            if (!document.body.classList.contains('app-active') || document.getElementById('manager-overlay').classList.contains('show')) {
                 canvasCtx.restore(); return;
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandDetected = true;
                const landmarks = results.multiHandLandmarks[0];
                
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(255, 255, 255, 0.5)', lineWidth: 3});
                drawLandmarks(canvasCtx, landmarks, {color: '#dcb560', lineWidth: 1, radius: 2});

                const dx = landmarks[8].x - landmarks[4].x;
                const dy = landmarks[8].y - landmarks[4].y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                let mappedScale = (distance - 0.05) * (2.0 / 0.25) + 0.5;
                targetScaleMult = Math.max(0.4, Math.min(mappedScale, 2.5)); 

                const handCenterX = landmarks[0].x; 
                const handCenterY = landmarks[0].y;
                targetRotationY = -(handCenterX - 0.5) * Math.PI * 2; 
                targetRotationX = (handCenterY - 0.5) * Math.PI * 1.5; 
                targetPositionX = (handCenterX - 0.5) * 8; 

                hintPos.classList.remove('active');
                hintScale.classList.remove('active');
                hintSwitch.classList.remove('active');

                const isPinching = distance < 0.04;
                
                if (isPinching) {
                    hintSwitch.classList.add('active'); 
                    
                    if (!hasSwitched) {
                        if (pinchStartTime === 0) pinchStartTime = now;
                        let progress = (now - pinchStartTime) / 1500;
                        if (progress >= 1.0) {
                            switchToNextModel();
                            hasSwitched = true;
                            progress = 0;
                            lastSwitchTime = now;
                            gestureStatus.innerText = "SYSTEM SWITCHED";
                            gestureStatus.style.color = "#ff00ff";
                            gestureStatus.style.textShadow = "none";
                        } else {
                            gestureStatus.innerText = "HOLD TO SWITCH";
                            gestureStatus.style.color = "var(--accent-color)";
                            gestureStatus.style.textShadow = "0 0 8px rgba(220, 181, 96, 0.5)";
                        }
                        progressCircle.style.strokeDashoffset = circumference - progress * circumference;
                        
                        gestureUI.classList.add('active');
                        skeletonUI.classList.add('active');
                    } else {
                        progressCircle.style.strokeDashoffset = circumference;
                    }
                } else {
                    pinchStartTime = 0;
                    hasSwitched = false;
                    progressCircle.style.strokeDashoffset = circumference;

                    if (distance > 0.04 && distance < 0.15) {
                        hintScale.classList.add('active'); 
                    } else {
                        hintPos.classList.add('active'); 
                    }

                    if (now - lastSwitchTime > 1500) { 
                        gestureStatus.innerText = "LIVE TRACKING";
                        gestureStatus.style.color = "#00ff66";
                        gestureStatus.style.textShadow = "0 0 10px rgba(0, 255, 102, 0.6)";
                        gestureStatus.classList.add('active');
                        gestureUI.classList.add('active');
                        skeletonUI.classList.add('active');
                    }
                }

            } else {
                isHandDetected = false;
                pinchStartTime = 0;
                hasSwitched = false;
                progressCircle.style.strokeDashoffset = circumference;
                
                hintPos.classList.remove('active');
                hintScale.classList.remove('active');
                hintSwitch.classList.remove('active');

                gestureStatus.innerText = "WAITING FOR SIGNAL";
                gestureStatus.style.color = "var(--text-main)";
                gestureStatus.style.textShadow = "none";
                gestureStatus.classList.remove('active');
                gestureUI.classList.remove('active');
                skeletonUI.classList.remove('active');
            }
            canvasCtx.restore();
        });

        const camera_mp = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 320,
            height: 240
        });

        setTimeout(() => {
            camera_mp.start().then(() => {
                gestureStatus.innerText = "WAITING FOR SIGNAL";
            }).catch(err => {
                gestureStatus.innerText = "CAMERA DENIED";
            });
        }, 1500);

        initScene();

    </script>
</body>
</html>
